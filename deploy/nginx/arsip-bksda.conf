# Nginx local development config for ARSIP BKSDA.
# Copy this file to your Nginx conf.d directory, then adjust paths/ports if needed.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Limit each client IP to 10 requests per second.
    # burst allows short UI bursts while still rejecting sustained abuse.
    limit_req_zone $binary_remote_addr zone=arsip_admin:10m rate=10r/s;

    server {
        listen 8080;
        server_name localhost;
        root C:/xampp/htdocs/parido/public;
        index index.php index.html;

        location /admin/ {
            limit_req zone=arsip_admin burst=20 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
